<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paddles on sale</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="pd {{mode}}" style="width: 390px; height: 1500px; position: relative; overflow: hidden">
<div style="padding: 54px 16px 0; display: flex; align-items: center; justify-content: space-between">
<a href="Browse.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 20px; background: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<div style="display: flex; gap: 8px">
<button style="height: 40px; padding: 0 14px; border-radius: 20px; background: var(--surface); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Save search</button>
<a href="Search.dc.html" aria-label="Search" style="width: 40px; height: 40px; border-radius: 20px; background: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></a>
</div>
</div>
<div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 2px">
<h1 style="font-size: 34px; font-weight: 700; letter-spacing: -0.025em">Paddles</h1>
<span class="num" style="font-size: 15px; color: var(--text-2)">214 deals · 31 at their lowest price</span>
</div>
<div class="noscroll" style="display: flex; gap: 8px; overflow-x: auto; padding: 16px 16px 0">
<span style="flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 18px; background: var(--int); color: var(--on-int); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>2</span>
<span style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; background: var(--surface); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 4px">Biggest discount <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>
<span style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1.5px solid var(--int); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px">16mm <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
<span style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1.5px solid var(--int); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px">20%+ off <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
<span style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; background: var(--surface); font-size: 15px; font-weight: 600; display: flex; align-items: center">Brand</span>
<span style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; background: var(--surface); font-size: 15px; font-weight: 600; display: flex; align-items: center">Retailer</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 12px; padding: 20px 16px 0">
<sc-for list="{{deals}}" as="d" hint-placeholder-count="6">
<div style="position: relative">
<a href="ProductDetail.dc.html" style="display: flex; flex-direction: column; gap: 6px">
<div style="position: relative; height: 200px; border-radius: 16px; background: var(--img); padding: 16px 22px"><dc-import name="ProductArt" kind="paddle" c1="{{d.c1}}" c2="{{d.c2}}" hint-size="100%,100%"></dc-import><sc-if value="{{d.badge}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 8px; top: 8px; font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 4px 7px; border-radius: 6px; background: var(--bg)">{{d.badge}}</span></sc-if></div>
<span style="font-size: 12px; font-weight: 600; color: var(--text-2)">{{d.brand}}</span>
<span class="clamp2" style="font-size: 15px; font-weight: 500; line-height: 1.25; margin-top: -2px">{{d.name}}</span>
<div style="display: flex; align-items: baseline; gap: 6px"><span class="num" style="font-size: 17px; font-weight: 700">{{d.price}}</span><span class="num" style="font-size: 13px; color: var(--text-3); text-decoration: line-through">{{d.was}}</span><span class="num" style="margin-left: auto; font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: var(--int); color: var(--on-int)">{{d.off}}</span></div>
<span style="font-size: 12px; color: var(--text-2)">{{d.meta}}</span>
</a>
<button aria-label="Save" class="glass" style="position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="{{d.fill}}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.4-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.8-7.5 10.2-7.5 10.2z"/></svg></button>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 16px; bottom: 24px"><dc-import name="TabBar" active="deals" hint-size="358px,64px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      mode: this.props.theme === 'dark' ? 'dark' : '',
      deals: [
        { c1: '#1F5FD1', c2: '#C8F03C', badge: 'LOWEST PRICE', brand: 'JOOLA', name: 'Perseus Pro IV 16mm', price: '$179', was: '$279', off: '−36%', meta: 'Amazon · Save $100', fill: 'currentColor' },
        { c1: '#26282B', c2: '#9BE15D', badge: 'HOT DEAL', brand: 'CRBN', name: '3X Power Series 16mm', price: '$169', was: '$229', off: '−26%', meta: 'Amazon · Save $60', fill: 'none' },
        { c1: '#D7263D', c2: '#F4D35E', badge: 'PRICE DROP', brand: 'Selkirk', name: 'Vanguard Power Air Invikta', price: '$189', was: '$250', off: '−24%', meta: 'Amazon · was $229 yesterday', fill: 'none' },
        { c1: '#0F9D8A', c2: '#FFD166', badge: '', brand: 'Engage', name: 'Pursuit Pro1 6.0', price: '$159', was: '$199', off: '−20%', meta: 'CourtSide Pro Shop', fill: 'none' },
        { c1: '#FF6B35', c2: '#1C1C1C', badge: 'PROMO CODE', brand: 'Gearbox', name: 'Pro Power Fusion 16mm', price: '$199', was: '$250', off: '−20%', meta: 'Code GBX20 at checkout', fill: 'none' },
        { c1: '#111111', c2: '#F2C14E', badge: 'ENDING SOON', brand: 'Six Zero', name: 'Double Black Diamond 16mm', price: '$149', was: '$180', off: '−17%', meta: 'Ends in 3h · SixZero.com', fill: 'none' }
      ]
    };
  }
}
</script>
</body>
</html>
