<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Respond to offer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="pd {{mode}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg)">
<div aria-hidden="true" style="padding: 70px 16px 0; display: flex; flex-direction: column; gap: 6px">
<div style="align-self: flex-start; max-width: 75%; padding: 8px 12px; border-radius: 18px 18px 18px 6px; background: var(--bubble-in); font-size: 16px">Hey, is the CRBN still available?</div>
<div style="align-self: flex-start; width: 260px; border-radius: 18px; border: 1px solid var(--border); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; font-weight: 700; letter-spacing: .08em">OFFER · PENDING</span><span class="num" style="font-size: 22px; font-weight: 700">$120</span></div>
</div>
<div style="position: absolute; inset: 0; background: var(--overlay)"></div>
<div role="dialog" aria-label="Respond to offer" style="position: absolute; left: 0; right: 0; bottom: 0; height: 600px; border-radius: 28px 28px 0 0; background: var(--surface-elev); box-shadow: var(--shadow-sheet); padding: 8px 20px 34px; display: flex; flex-direction: column; gap: 14px">
<span style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--border)"></span>
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Conversation.dc.html" style="font-size: 17px; color: var(--text-2)">Cancel</a>
<span style="font-size: 17px; font-weight: 700">Counteroffer</span>
<span style="width: 52px"></span>
</div>
<div class="num" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-radius: 16px; background: var(--surface)">
<div style="padding: 12px 14px; display: flex; flex-direction: column"><span style="font-size: 12px; color: var(--text-2)">Jordan offered</span><span style="font-size: 22px; font-weight: 700">$120</span></div>
<div style="padding: 12px 14px; display: flex; flex-direction: column; border-left: 1px solid var(--bg)"><span style="font-size: 12px; color: var(--text-2)">You’re asking</span><span style="font-size: 22px; font-weight: 700">$150</span></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; padding-top: 4px">
<button aria-label="Decrease by $5" onClick="{{dec}}" style="width: 48px; height: 48px; border-radius: 24px; background: var(--chip); font-size: 26px; display: flex; align-items: center; justify-content: center">−</button>
<div style="display: flex; flex-direction: column; align-items: center"><span style="font-size: 13px; font-weight: 600; color: var(--text-2)">Your counter</span><span class="num" style="font-size: 56px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.05">${{amount}}</span></div>
<button aria-label="Increase by $5" onClick="{{inc}}" style="width: 48px; height: 48px; border-radius: 24px; background: var(--chip); font-size: 26px; display: flex; align-items: center; justify-content: center">+</button>
</div>
<span class="num" style="text-align: center; font-size: 13px; color: var(--text-2)">CRBN 3X 16mm · typical used $105–$135 · new from $169</span>
<label style="display: flex; flex-direction: column; gap: 4px; padding: 10px 14px; border-radius: 14px; background: var(--surface)"><span style="font-size: 12px; font-weight: 600; color: var(--text-2)">Message (optional)</span><input value="Lowest I can do is 140 — it’s like new." style="border: 0; outline: 0; background: transparent; font-size: 15px"></label>
<div style="flex-grow: 1"></div>
<a href="Conversation.dc.html" class="num" style="height: 52px; border-radius: 26px; background: var(--int); color: var(--on-int); font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Send counter · ${{amount}}</a>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="Conversation.dc.html" style="height: 46px; border-radius: 23px; background: var(--chip); font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Accept $120</a>
<a href="Conversation.dc.html" style="height: 46px; border-radius: 23px; border: 1px solid var(--border); font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Decline</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { amount: 140 }; }
  renderVals() {
    const a = this.state.amount;
    return {
      mode: this.props.theme === 'dark' ? 'dark' : '',
      amount: a,
      dec: () => this.setState({ amount: Math.max(125, a - 5) }),
      inc: () => this.setState({ amount: Math.min(150, a + 5) })
    };
  }
}
</script>
</body>
</html>
