<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manage listing</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="pd {{mode}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--surface)">
<div style="position: absolute; inset: 0; background: var(--overlay)"></div>
<div role="dialog" aria-label="Manage listing" style="position: absolute; left: 0; right: 0; bottom: 0; height: 660px; border-radius: 28px 28px 0 0; background: var(--surface-elev); box-shadow: var(--shadow-sheet); padding: 8px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<span style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--border)"></span>
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 56px; height: 56px; border-radius: 12px; background: var(--img); padding: 5px"><dc-import name="ProductArt" kind="paddle" c1="#26282B" c2="#9BE15D" hint-size="100%,100%"></dc-import></div>
<div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 700">CRBN 3X Power 16mm</span><span class="num" style="font-size: 13px; color: var(--text-2)">$150 · Like New · 2 offers</span></div>
<a href="MyListings.dc.html" aria-label="Close" style="width: 32px; height: 32px; border-radius: 16px; background: var(--chip); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--text-3)">STATUS</span>
<div role="radiogroup" aria-label="Listing status" style="height: 44px; border-radius: 12px; background: var(--surface); padding: 3px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
<sc-for list="{{states}}" as="s" hint-placeholder-count="3">
<button role="radio" aria-checked="{{s.on}}" onClick="{{s.pick}}" style="border-radius: 9px; font-size: 15px; font-weight: 700; text-align: center; background: {{s.bg}}; color: {{s.fg}}">{{s.t}}</button>
</sc-for>
</div>
<span style="font-size: 13px; line-height: 1.4; color: var(--text-2)">{{help}}</span>
</div>
<sc-if value="{{needsBuyer}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--text-3)">WHO’S BUYING? (OPTIONAL)</span>
<div style="border-radius: 14px; border: 1px solid var(--border)">
<sc-for list="{{buyers}}" as="b" hint-placeholder-count="3">
<button onClick="{{b.pick}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--sep); text-align: left">
<span style="width: 32px; height: 32px; border-radius: 16px; background: var(--surface-pressed); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{b.i}}</span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">{{b.n}}</span><span class="num" style="font-size: 12px; color: var(--text-2)">{{b.d}}</span></span>
<span style="width: 22px; height: 22px; border-radius: 11px; border: {{b.ring}}; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{b.dot}}"></span></span>
</button>
</sc-for>
</div>
<span style="font-size: 12px; color: var(--text-2)">Linking the buyer lets you both leave a review later. Other chats get a polite “no longer available”.</span>
</div>
</sc-if>
<div style="flex-grow: 1"></div>
<button style="height: 54px; border-radius: 27px; background: var(--int); color: var(--on-int); font-size: 17px; font-weight: 700">{{cta}}</button>
<div style="display: flex; justify-content: space-around">
<a href="SellPrice.dc.html" style="font-size: 15px; font-weight: 600">Edit listing</a>
<button style="font-size: 15px; font-weight: 600; color: var(--text-2)">Delete listing</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { st: 'Pending', buyer: 0 }; }
  renderVals() {
    const st = this.state.st, by = this.state.buyer;
    const states = ['Active', 'Pending', 'Sold'].map((t) => ({
      t, on: st === t, pick: () => this.setState({ st: t }),
      bg: st === t ? 'var(--int)' : 'transparent', fg: st === t ? 'var(--on-int)' : 'var(--text-1)'
    }));
    const help = {
      Active: 'Visible to everyone. Buyers can message and send offers.',
      Pending: 'Still visible, marked Pending. New offers pause; existing chats continue.',
      Sold: 'Hidden from search. Chats stay in your inbox for reference.'
    }[st];
    const buyers = [
      { i: 'J', n: 'Jordan R.', d: 'Offered $120 · countered $140' },
      { i: 'P', n: 'Priya K.', d: 'Offered $135' },
      { i: '–', n: 'Someone outside PickleDeals', d: 'Skip linking a buyer' }
    ].map((b, i) => Object.assign({}, b, {
      pick: () => this.setState({ buyer: i }),
      ring: by === i ? '2px solid var(--int)' : '1.5px solid var(--border)', dot: by === i ? 'var(--int)' : 'transparent'
    }));
    return {
      mode: this.props.theme === 'dark' ? 'dark' : '',
      states, help, buyers,
      needsBuyer: st !== 'Active',
      cta: st === 'Active' ? 'Keep active' : 'Mark as ' + st.toLowerCase()
    };
  }
}
</script>
</body>
</html>
