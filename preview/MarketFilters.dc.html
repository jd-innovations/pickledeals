<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marketplace filters</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="pd {{mode}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--surface)">
<div style="position: absolute; inset: 0; background: var(--overlay)"></div>
<div role="dialog" aria-label="Filters" style="position: absolute; left: 0; right: 0; bottom: 0; top: 56px; border-radius: 28px 28px 0 0; background: var(--surface-elev); box-shadow: var(--shadow-sheet); display: flex; flex-direction: column">
<div style="padding: 8px 20px 0; display: flex; flex-direction: column">
<span style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--border)"></span>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0 8px">
<button onClick="{{reset}}" style="font-size: 17px; color: var(--text-2)">Reset</button>
<span style="font-size: 17px; font-weight: 700">Filters</span>
<a href="MarketHome.dc.html" aria-label="Close" style="width: 32px; height: 32px; border-radius: 16px; background: var(--chip); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</div>
</div>
<div style="flex: 1; overflow: hidden; padding: 4px 20px 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 700">Distance from Sarasota</span>
<div style="height: 36px; border-radius: 10px; background: var(--surface); padding: 2px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
<sc-for list="{{dist}}" as="d" hint-placeholder-count="5">
<button onClick="{{d.pick}}" style="border-radius: 8px; font-size: 13px; font-weight: 600; text-align: center; background: {{d.bg}}; box-shadow: {{d.sh}}">{{d.t}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 700">Condition</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{conds}}" as="c" hint-placeholder-count="5">
<button onClick="{{c.toggle}}" aria-pressed="{{c.on}}" style="height: 36px; padding: 0 14px; border-radius: 18px; font-size: 15px; font-weight: 600; background: {{c.bg}}; color: {{c.fg}}">{{c.t}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 700">Category</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="height: 36px; padding: 0 14px; border-radius: 18px; background: var(--int); color: var(--on-int); font-size: 15px; font-weight: 600; display: flex; align-items: center">Paddles</span>
<span style="height: 36px; padding: 0 14px; border-radius: 18px; background: var(--chip); font-size: 15px; font-weight: 600; display: flex; align-items: center">Shoes</span>
<span style="height: 36px; padding: 0 14px; border-radius: 18px; background: var(--chip); font-size: 15px; font-weight: 600; display: flex; align-items: center">Bags</span>
<span style="height: 36px; padding: 0 14px; border-radius: 18px; background: var(--chip); font-size: 15px; font-weight: 600; display: flex; align-items: center">Ball machines</span>
<span style="height: 36px; padding: 0 14px; border-radius: 18px; background: var(--chip); font-size: 15px; font-weight: 600; display: flex; align-items: center">More</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between"><span style="font-size: 15px; font-weight: 700">Brand</span><span style="font-size: 15px; color: var(--text-2)">JOOLA, Selkirk ›</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 700">Price</span>
<div style="display: flex; align-items: center; gap: 10px">
<label style="flex: 1; height: 44px; border-radius: 12px; background: var(--surface); display: flex; align-items: center; padding: 0 12px; gap: 6px"><span style="font-size: 13px; color: var(--text-2)">Min</span><input value="$50" aria-label="Minimum price" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 17px; font-weight: 600"></label>
<span style="color: var(--text-3)">–</span>
<label style="flex: 1; height: 44px; border-radius: 12px; background: var(--surface); display: flex; align-items: center; padding: 0 12px; gap: 6px"><span style="font-size: 13px; color: var(--text-2)">Max</span><input value="$150" aria-label="Maximum price" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 17px; font-weight: 600"></label>
</div>
</div>
<div style="border-radius: 14px; background: var(--surface); overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--bg)"><span style="font-size: 15px; font-weight: 600">Local pickup</span><span role="switch" aria-checked="true" aria-label="Local pickup" style="width: 51px; height: 31px; border-radius: 16px; background: var(--int); position: relative"><span style="position: absolute; right: 2px; top: 2px; width: 27px; height: 27px; border-radius: 14px; background: var(--on-int)"></span></span></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px"><span style="font-size: 15px; font-weight: 600">Ships to me</span><span role="switch" aria-checked="false" aria-label="Ships to me" style="width: 51px; height: 31px; border-radius: 16px; background: var(--border); position: relative"><span style="position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 14px; background: #fff"></span></span></div>
</div>
<div style="display: flex; justify-content: space-between"><span style="font-size: 15px; font-weight: 700">Sort</span><span style="font-size: 15px; color: var(--text-2)">Nearest ›</span></div>
</div>
<div style="padding: 12px 20px 34px; border-top: 1px solid var(--sep)">
<a href="MarketHome.dc.html" class="num" style="height: 54px; border-radius: 27px; background: var(--int); color: var(--on-int); font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Show {{count}} listings</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { dist: '25 mi', conds: { 'Like New': true, 'Excellent': true } }; }
  renderVals() {
    const s = this.state;
    const dist = ['5 mi', '10 mi', '25 mi', '50 mi', 'Any'].map((t) => ({
      t, pick: () => this.setState({ dist: t }),
      bg: s.dist === t ? 'var(--surface-elev)' : 'transparent', sh: s.dist === t ? '0 1px 3px rgba(0,0,0,.14)' : 'none'
    }));
    const conds = ['New / Sealed', 'Like New', 'Excellent', 'Good', 'Fair'].map((t) => {
      const on = !!s.conds[t];
      return { t, on, bg: on ? 'var(--int)' : 'var(--chip)', fg: on ? 'var(--on-int)' : 'var(--text-1)',
        toggle: () => this.setState({ conds: Object.assign({}, s.conds, { [t]: !on }) }) };
    });
    const n = Object.keys(s.conds).filter((k) => s.conds[k]).length;
    const factor = { '5 mi': 0.3, '10 mi': 0.55, '25 mi': 1, '50 mi': 1.6, 'Any': 6 }[s.dist];
    return {
      mode: this.props.theme === 'dark' ? 'dark' : '',
      dist, conds,
      count: Math.max(1, Math.round((n || 5) * 7 * factor)),
      reset: () => this.setState({ dist: '25 mi', conds: {} })
    };
  }
}
</script>
</body>
</html>
