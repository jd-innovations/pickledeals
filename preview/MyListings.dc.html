<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My listings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="pd {{mode}}" style="width: 390px; height: 1100px; position: relative; overflow: hidden">
<div style="padding: 54px 16px 0; display: flex; align-items: center; justify-content: space-between">
<a href="Profile.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 20px; background: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<a href="SellStart.dc.html" aria-label="New listing" style="width: 40px; height: 40px; border-radius: 20px; background: var(--int); color: var(--on-int); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
</div>
<h1 style="font-size: 34px; font-weight: 700; letter-spacing: -0.025em; padding: 12px 16px 0">My listings</h1>
<div role="tablist" aria-label="Status" style="margin: 14px 16px 0; height: 36px; border-radius: 10px; background: var(--surface); padding: 2px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" class="num" style="border-radius: 8px; font-size: 15px; font-weight: 600; text-align: center; background: {{t.bg}}; box-shadow: {{t.sh}}; color: {{t.fg}}">{{t.label}}</button>
</sc-for>
</div>
<div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{rows}}" as="l" hint-placeholder-count="3">
<div style="border-radius: 20px; border: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 12px">
<a href="ListingDetail.dc.html" style="display: flex; gap: 12px; align-items: center">
<div style="position: relative; width: 76px; height: 76px; border-radius: 14px; background: var(--img); padding: 7px; flex-shrink: 0"><dc-import name="ProductArt" kind="{{l.k}}" c1="{{l.c1}}" c2="{{l.c2}}" hint-size="100%,100%"></dc-import></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
<div style="display: flex; align-items: center; gap: 6px"><span style="font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 3px 6px; border-radius: 5px; background: {{l.sbg}}; color: {{l.sfg}}">{{l.status}}</span><span style="font-size: 12px; color: var(--text-2)">{{l.age}}</span></div>
<span style="font-size: 15px; font-weight: 600">{{l.name}}</span>
<span class="num" style="font-size: 15px"><b>{{l.price}}</b> <span style="font-size: 13px; color: var(--text-2)">· {{l.cond}}</span></span>
</div>
</a>
<div class="num" style="display: flex; gap: 14px; font-size: 13px; color: var(--text-2)"><span><b style="color: var(--text-1)">{{l.offers}}</b> offers</span><span><b style="color: var(--text-1)">{{l.chats}}</b> chats</span><span><b style="color: var(--text-1)">{{l.saves}}</b> saves</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="Inbox.dc.html" style="height: 38px; border-radius: 19px; background: var(--chip); font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{l.primary}}</a>
<a href="ManageListing.dc.html" style="height: 38px; border-radius: 19px; border: 1px solid var(--border); font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">Manage</a>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'active' }; }
  renderVals() {
    const t = this.state.tab;
    const data = {
      active: [
        { k: 'paddle', c1: '#26282B', c2: '#9BE15D', status: 'ACTIVE', age: 'Listed 3 days ago', name: 'CRBN 3X Power 16mm', price: '$150', cond: 'Like New', offers: 2, chats: 4, saves: 11, primary: 'Review 2 offers' },
        { k: 'shoe', c1: '#FF5D8F', c2: '#1C1C1C', status: 'ACTIVE', age: 'Listed 1 week ago', name: 'Skechers Viper Court · 11', price: '$45', cond: 'Good', offers: 0, chats: 1, saves: 3, primary: 'Reduce price' },
        { k: 'grip', c1: '#4CC9F0', c2: '#F72585', status: 'ACTIVE', age: 'Listed today', name: 'Tourna Grip XL, 6 rolls', price: '$12', cond: 'New / Sealed', offers: 0, chats: 0, saves: 1, primary: 'Share listing' }
      ],
      pending: [
        { k: 'bag', c1: '#111111', c2: '#C8F03C', status: 'PENDING', age: 'Accepted $55 · Sam W.', name: 'JOOLA Vision II Backpack', price: '$60', cond: 'Like New', offers: 1, chats: 1, saves: 6, primary: 'Open chat' }
      ],
      sold: [
        { k: 'bag', c1: '#1D3557', c2: '#E63946', status: 'SOLD', age: 'Sep 24 · to Sam W.', name: 'Selkirk Core Tour Backpack', price: '$45', cond: 'Excellent', offers: 3, chats: 5, saves: 9, primary: 'Sell a similar item' }
      ]
    };
    const tabs = [['active', 'Active 3'], ['pending', 'Pending 1'], ['sold', 'Sold 14']].map(([k, label]) => ({
      label, on: t === k, pick: () => this.setState({ tab: k }),
      bg: t === k ? 'var(--surface-elev)' : 'transparent', sh: t === k ? '0 1px 3px rgba(0,0,0,.12)' : 'none',
      fg: t === k ? 'var(--text-1)' : 'var(--text-2)'
    }));
    const solid = { sbg: 'var(--int)', sfg: 'var(--on-int)' };
    const soft = { sbg: 'var(--chip)', sfg: 'var(--text-1)' };
    return {
      mode: this.props.theme === 'dark' ? 'dark' : '',
      tabs,
      rows: data[t].map((r) => Object.assign({}, r, r.status === 'ACTIVE' ? soft : solid))
    };
  }
}
</script>
</body>
</html>
