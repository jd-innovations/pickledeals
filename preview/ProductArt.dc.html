<html lang="en">
<head>
<meta charset="utf-8">
<title>Product image</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">

<body>

</helmet>

</sc-if>
<sc-if value="{{isBall}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 200 200" style="width: 100%; height: 100%; display: block" aria-hidden="true"><ellipse cx="100" cy="170" rx="48" ry="6" fill="#000" opacity=".08"/><circle cx="100" cy="96" r="62" fill="{{c1}}"/><ellipse cx="76" cy="68" rx="22" ry="13" fill="#fff" opacity=".35"/><g fill="#000" opacity=".16"><circle cx="100" cy="58" r="6"/><circle cx="68" cy="82" r="6"/><circle cx="132" cy="82" r="6"/><circle cx="100" cy="96" r="6"/><circle cx="82" cy="118" r="6"/><circle cx="118" cy="118" r="6"/><circle cx="100" cy="142" r="6"/><circle cx="56" cy="112" r="5"/><circle cx="144" cy="112" r="5"/></g></svg>

<sc-if value="{{isBag}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 200 200" style="width: 100%; height: 100%; display: block" aria-hidden="true"><ellipse cx="100" cy="176" rx="52" ry="6" fill="#000" opacity=".08"/><rect x="112" y="8" width="14" height="40" rx="5" fill="#1c1c1c"/><path d="M78 42 C78 26 122 26 122 42" fill="none" stroke="#1c1c1c" stroke-width="6" stroke-linecap="round"/><rect x="52" y="38" width="96" height="134" rx="30" fill="{{c1}}"/><path d="M60 70 L140 70" stroke="#000" stroke-opacity=".16" stroke-width="3"/><rect x="64" y="104" width="72" height="56" rx="16" fill="{{c2}}"/><rect x="64" y="104" width="72" height="8" rx="4" fill="#000" opacity=".12"/></svg>

</sc-if>
<sc-if value="{{isEyewear}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 200 200" style="width: 100%; height: 100%; display: block" aria-hidden="true"><ellipse cx="100" cy="150" rx="70" ry="5" fill="#000" opacity=".08"/><path d="M30 92 L12 82 M170 92 L188 82" stroke="#1c1c1c" stroke-width="6" stroke-linecap="round"/><rect x="28" y="84" width="64" height="46" rx="20" fill="{{c2}}" stroke="{{c1}}" stroke-width="7"/><rect x="108" y="84" width="64" height="46" rx="20" fill="{{c2}}" stroke="{{c1}}" stroke-width="7"/><path d="M92 98 Q100 90 108 98" stroke="{{c1}}" stroke-width="6" fill="none"/><path d="M40 96 L58 92 M120 96 L138 92" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/></svg>
</sc-if>
<sc-if value="{{isApparel}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 200 200" style="width: 100%; height: 100%; display: block" aria-hidden="true"><ellipse cx="100" cy="180" rx="50" ry="5" fill="#000" opacity=".08"/><path d="M70 30 L48 40 L20 72 L44 96 L58 84 L58 170 L142 170 L142 84 L156 96 L180 72 L152 40 L130 30 C124 46 76 46 70 30 Z" fill="{{c1}}"/><path d="M70 30 C76 46 124 46 130 30" fill="none" stroke="#000" stroke-opacity=".2" stroke-width="4"/><rect x="58" y="118" width="84" height="9" fill="{{c2}}"/></svg>
</sc-if>
<sc-if value="{{isMachine}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 200 200" style="width: 100%; height: 100%; display: block" aria-hidden="true"><ellipse cx="100" cy="178" rx="62" ry="6" fill="#000" opacity=".08"/><path d="M66 82 L76 30 L124 30 L134 82 Z" fill="#000" opacity=".14"/><g fill="#d8f23a"><circle cx="88" cy="46" r="9"/><circle cx="108" cy="44" r="9"/><circle cx="98" cy="62" r="9"/><circle cx="118" cy="62" r="9"/><circle cx="80" cy="64" r="9"/></g><rect x="48" y="78" width="104" height="84" rx="14" fill="{{c1}}"/><circle cx="100" cy="116" r="16" fill="#1c1c1c"/><circle cx="100" cy="116" r="7" fill="{{c2}}"/><circle cx="66" cy="168" r="10" fill="#1c1c1c"/><circle cx="134" cy="168" r="10" fill="#1c1c1c"/></svg>
</sc-if>
<sc-if value="{{isNet}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 200 200" style="width: 100%; height: 100%; display: block" aria-hidden="true"><ellipse cx="100" cy="172" rx="86" ry="5" fill="#000" opacity=".08"/><rect x="20" y="64" width="8" height="104" rx="3" fill="#1c1c1c"/><rect x="172" y="64" width="8" height="104" rx="3" fill="#1c1c1c"/><rect x="28" y="70" width="144" height="10" fill="{{c1}}"/><g stroke="#1c1c1c" stroke-opacity=".35" stroke-width="1.5"><path d="M28 92 H172 M28 104 H172 M28 116 H172 M28 128 H172"/><path d="M40 80 V134 M52 80 V134 M64 80 V134 M76 80 V134 M88 80 V134 M100 80 V134 M112 80 V134 M124 80 V134 M136 80 V134 M148 80 V134 M160 80 V134"/></g><rect x="28" y="134" width="144" height="4" fill="{{c2}}"/><path d="M8 168 H40 M160 168 H192" stroke="#1c1c1c" stroke-width="6" stroke-linecap="round"/></svg>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["paddle","shoe","ball","bag","grip","eyewear","apparel","machine","net"],"default":"paddle"},"c1":{"editor":"color","default":"#1F5FD1"},"c2":{"editor":"color","default":"#C8F03C"},"$preview":{"width":240,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind || 'paddle';
    const known = ['shoe','ball','bag','grip','eyewear','apparel','machine','net'];
    return {
      c1: this.props.c1 || '#1F5FD1',
      c2: this.props.c2 || '#C8F03C',
      isPaddle: known.indexOf(k) === -1,
      isShoe: k === 'shoe', isBall: k === 'ball', isBag: k === 'bag', isGrip: k === 'grip',
      isEyewear: k === 'eyewear', isApparel: k === 'apparel', isMachine: k === 'machine', isNet: k === 'net'
    };
  }
}
</script>
</body>
</html>
