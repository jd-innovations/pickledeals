<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="pd {{mode}}" style="width: 390px; height: 1300px; position: relative; overflow: hidden; background: var(--surface)">
<h1 style="font-size: 34px; font-weight: 700; letter-spacing: -0.025em; padding: 58px 16px 0">Profile</h1>
<section style="padding: 14px 16px 0; display: flex; align-items: center; gap: 14px">
<button aria-label="Profile photo. Change or remove" style="position: relative; width: 64px; height: 64px; flex-shrink: 0"><span style="width: 64px; height: 64px; border-radius: 32px; display: block; overflow: hidden; background: linear-gradient(135deg, #F2C14E 0%, #E07A5F 55%, #3D405B 100%)"><svg viewBox="0 0 68 68" width="64" height="64" aria-hidden="true"><circle cx="34" cy="27" r="12" fill="rgba(255,255,255,.85)"/><path d="M12 64c2-13 11-20 22-20s20 7 22 20z" fill="rgba(255,255,255,.85)"/></svg></span><span style="position: absolute; right: -2px; bottom: -2px; width: 24px; height: 24px; border-radius: 12px; background: var(--int); color: var(--on-int); border: 2px solid var(--surface); display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span></button>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><h2 style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Dana H.</h2><span style="font-size: 15px; color: var(--text-2)">Sarasota, FL</span><span class="num" style="font-size: 15px; color: var(--text-2)">Member since 2026</span></div>
<button style="height: 34px; padding: 0 14px; border-radius: 17px; background: var(--chip); font-size: 15px; font-weight: 600">Edit</button>
</section>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<section style="padding: 24px 16px 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: var(--text-2); padding: 0 16px">{{g.label}}</span>
<div style="border-radius: 16px; background: var(--bg); overflow: hidden">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<a href="{{r.href}}" style="display: flex; align-items: center; gap: 14px; padding: 0 16px; min-height: 50px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="{{r.icon}}"/></svg>
<span style="flex: 1; align-self: stretch; display: flex; align-items: center; gap: 12px; border-bottom: {{r.sep}}">
<span style="flex: 1; font-size: 17px">{{r.t}}</span>
<span class="num" style="font-size: 15px; color: var(--text-2)">{{r.v}}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="color: var(--text-3); visibility: {{r.chev}}" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</span>
</a>
</sc-for>
<sc-if value="{{g.appearance}}" hint-placeholder-val="{{false}}">
<div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 14px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
<span style="font-size: 17px">Appearance</span>
</div>
<div role="radiogroup" aria-label="Appearance" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
<button role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<span style="width: 100%; height: 72px; border-radius: 12px; overflow: hidden; border: {{o.border}}; display: flex; background: {{o.bgA}}">
<span style="flex: 1; padding: 9px 8px; display: flex; flex-direction: column; gap: 5px; background: {{o.bgA}}"><span style="height: 5px; width: 70%; border-radius: 3px; background: {{o.fgA}}"></span><span style="height: 4px; width: 45%; border-radius: 2px; background: {{o.fgA}}; opacity: .5"></span><span style="flex: 1; border-radius: 6px; background: {{o.tileA}}"></span></span>
<span style="flex: {{o.split}}; padding: 9px 8px; display: flex; flex-direction: column; gap: 5px; background: {{o.bgB}}"><span style="height: 5px; width: 70%; border-radius: 3px; background: {{o.fgB}}"></span><span style="height: 4px; width: 45%; border-radius: 2px; background: {{o.fgB}}; opacity: .5"></span><span style="flex: 1; border-radius: 6px; background: {{o.tileB}}"></span></span>
</span>
<span style="font-size: 14px; font-weight: {{o.weight}}; color: {{o.color}}">{{o.t}}</span>
</button>
</sc-for>
</div>
</div>
</sc-if>
</div>
</section>
</sc-for>
<button style="margin: 24px 16px 0; width: 358px; height: 50px; border-radius: 16px; background: var(--bg); font-size: 17px; font-weight: 600; text-align: center">Sign out</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 'System' }; }
  renderVals() {
    const p = this.state.pick;
    // Stroke icons, same family as the app's icon set (SF Symbols on iPhone).
    const I = {
      heart: 'M12 20.5s-7.5-4.4-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.8-7.5 10.2-7.5 10.2z',
      bell: 'M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z M10 20a2 2 0 0 0 4 0',
      priceAlert: 'M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z M8 7.5h.01 M12 10v6 M9.5 13.5L12 16l2.5-2.5',
      star: 'M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z',
      tag: 'M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z M8 7.5h.01',
      pin: 'M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z M12 7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z',
      offer: 'M8 13V5a1.5 1.5 0 0 1 3 0v6 M11 11V4a1.5 1.5 0 0 1 3 0v7 M14 11V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-12 0v-3a1.5 1.5 0 0 1 3 0',
      message: 'M20.5 12a8.5 8.5 0 0 1-12.3 7.6L3.5 20.5l1-4.4A8.5 8.5 0 1 1 20.5 12z',
      person: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4.5 20.5a7.5 7.5 0 0 1 15 0',
      help: 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17z M9.6 9.6a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.4v.6 M12 16.8h.01',
      doc: 'M7 3h7l4 4v14H7z M14 3v4h4 M9.5 12h5 M9.5 16h5',
      lock: 'M6 11h12v9.5H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3',
      info: 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17z M12 11v5.5 M12 7.8h.01'
    };
    const row = (t, icon, v, href, last, chev = 'visible') => ({ t, icon: I[icon], v, href, chev, sep: last ? '0' : '1px solid var(--sep)' });
    const L = { bg: '#FFFFFF', fg: '#0A0A0A', tile: '#F1F1EF' }, D = { bg: '#0B0B0C', fg: '#F5F5F4', tile: '#1A1A1C' };
    const mk = (t, a, b, split) => ({
      t, on: p === t, pick: () => this.setState({ pick: t }), split,
      bgA: a.bg, fgA: a.fg, tileA: a.tile, bgB: b.bg, fgB: b.fg, tileB: b.tile,
      border: p === t ? '2.5px solid var(--int)' : '1px solid var(--border)',
      weight: p === t ? '700' : '500', color: p === t ? 'var(--text-1)' : 'var(--text-2)'
    });
    const dark = p === 'Dark' || (p === 'System' && this.props.theme === 'dark');
    return {
      mode: dark ? 'dark' : '',
      opts: [mk('Light', L, L, '0'), mk('Dark', D, D, '0'), mk('System', L, D, '1')],
      groups: [
        { label: 'Shopping', rows: [
          row('Saved', 'heart', '12', 'Saved.dc.html'),
          row('Price alerts', 'priceAlert', '3', 'Saved.dc.html'),
          row('Followed brands', 'star', '2', 'Browse.dc.html', true) ] },
        { label: 'Buying & selling', rows: [
          row('My listings', 'tag', '3', 'MyListings.dc.html'),
          row('Location', 'pin', 'Sarasota, FL', 'Profile.dc.html'),
          row('Offers', 'offer', '', 'Inbox.dc.html'),
          row('Messages', 'message', '', 'Inbox.dc.html', true) ] },
        { label: 'Settings', appearance: true, rows: [
          row('Notifications', 'bell', '', 'NotifPrefs.dc.html'),
          row('Account', 'person', '', 'Profile.dc.html') ] },
        { label: 'About', rows: [
          row('Support', 'help', '', 'Profile.dc.html'),
          row('Terms of Use', 'doc', '', 'Profile.dc.html'),
          row('Privacy Policy', 'lock', '', 'Profile.dc.html'),
          row('Version', 'info', '1.0.0', 'Profile.dc.html', true, 'hidden') ] }
      ]
    };
  }
}
</script>
</body>
</html>
