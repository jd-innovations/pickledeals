<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="pd {{mode}}" style="width: 390px; height: 1400px; position: relative; overflow: hidden; background: var(--surface)">
<div style="padding: 54px 16px 0; display: flex; align-items: center; justify-content: space-between">
<a href="DealsHome.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 20px; background: var(--bg); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<button style="font-size: 17px; font-weight: 600">Edit</button>
</div>
<section style="padding: 12px 16px 0; display: flex; align-items: center; gap: 14px">
<span style="width: 68px; height: 68px; border-radius: 34px; background: var(--surface-pressed); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700">D</span>
<div style="display: flex; flex-direction: column; gap: 2px"><h1 style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Dana H.</h1><span class="num" style="font-size: 14px; color: var(--text-2)">Sarasota, FL · member since 2026</span></div>
</section>
<section class="num" style="margin: 18px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<a href="Saved.dc.html" style="padding: 12px; border-radius: 16px; background: var(--bg); display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 700">14</span><span style="font-size: 12px; color: var(--text-2)">Saved</span></a>
<a href="Saved.dc.html" style="padding: 12px; border-radius: 16px; background: var(--bg); display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 700">3</span><span style="font-size: 12px; color: var(--text-2)">Price alerts</span></a>
<a href="MyListings.dc.html" style="padding: 12px; border-radius: 16px; background: var(--bg); display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 700">3</span><span style="font-size: 12px; color: var(--text-2)">Listings</span></a>
</section>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<section style="padding: 24px 16px 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: var(--text-2); padding: 0 16px">{{g.label}}</span>
<div style="border-radius: 16px; background: var(--bg); overflow: hidden">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<a href="{{r.href}}" style="display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 50px; border-bottom: 1px solid var(--sep)">
<span style="flex: 1; font-size: 17px">{{r.t}}</span>
<span class="num" style="font-size: 15px; color: var(--text-2)">{{r.v}}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="color: var(--text-3)" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</a>
</sc-for>
</div>
</section>
</sc-for>
<button style="margin: 24px 16px 0; width: 358px; height: 50px; border-radius: 16px; background: var(--bg); font-size: 17px; font-weight: 600; text-align: center">Sign out</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      mode: this.props.theme === 'dark' ? 'dark' : '',
      groups: [
        { label: 'Shopping', rows: [
          { t: 'Saved products & deals', v: '10', href: 'Saved.dc.html' },
          { t: 'Saved listings', v: '2', href: 'Saved.dc.html' },
          { t: 'Price alerts', v: '3', href: 'Saved.dc.html' },
          { t: 'Followed brands', v: '2', href: 'Browse.dc.html' } ] },
        { label: 'Buying & selling', rows: [
          { t: 'My listings', v: '3 active', href: 'MyListings.dc.html' },
          { t: 'Offers', v: '2 open', href: 'Inbox.dc.html' },
          { t: 'Sold', v: '14', href: 'MyListings.dc.html' },
          { t: 'Messages', v: '', href: 'Inbox.dc.html' } ] },
        { label: 'Settings', rows: [
          { t: 'Notifications', v: '', href: 'NotifPrefs.dc.html' },
          { t: 'Location', v: 'Sarasota · 25 mi', href: 'Profile.dc.html' },
          { t: 'Appearance', v: 'System', href: 'Appearance.dc.html' },
          { t: 'Account', v: '', href: 'Profile.dc.html' } ] },
        { label: 'About', rows: [
          { t: 'How PickleDeals makes money', v: '', href: 'Profile.dc.html' },
          { t: 'Help & support', v: '', href: 'Profile.dc.html' },
          { t: 'Privacy', v: '', href: 'Profile.dc.html' },
          { t: 'Terms', v: '', href: 'Profile.dc.html' } ] }
      ]
    };
  }
}
</script>
</body>
</html>
