<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search suggestions</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="pd {{mode}}" style="width: 390px; height: 844px; position: relative; overflow: hidden">
<div style="padding: 62px 16px 0; display: flex; align-items: center; gap: 12px">
<label style="flex: 1; height: 44px; border-radius: 22px; background: var(--surface); display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 1.5px solid var(--int)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search</span>
<input type="search" value="perseus" style="flex: 1; border: 0; outline: 0; background: transparent; font-size: 17px">
<span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 9px; background: var(--text-3); color: var(--bg); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
</label>
<a href="DealsHome.dc.html" style="font-size: 17px; font-weight: 500">Cancel</a>
</div>

<div style="padding: 20px 16px 0; display: flex; flex-direction: column">
<span style="font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--text-3); padding-bottom: 6px">PRODUCTS</span>
<sc-for list="{{products}}" as="p" hint-placeholder-count="3">
<a href="SearchResults.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--sep)">
<div style="width: 48px; height: 48px; border-radius: 12px; background: var(--img); padding: 4px; flex-shrink: 0"><dc-import name="ProductArt" kind="paddle" c1="{{p.c1}}" c2="{{p.c2}}" hint-size="100%,100%"></dc-import></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600">{{p.name}}</span><span class="num" style="font-size: 13px; color: var(--text-2)">{{p.meta}}</span></div>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color: var(--text-3)" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</a>
</sc-for>
<span style="font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--text-3); padding: 18px 0 6px">SEARCHES</span>
<sc-for list="{{queries}}" as="q" hint-placeholder-count="3">
<a href="SearchResults.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; border-bottom: 1px solid var(--sep)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color: var(--text-3)" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
<span style="flex: 1; font-size: 17px"><b>perseus</b>{{q.rest}}</span>
<span style="font-size: 13px; color: var(--text-2)">{{q.scope}}</span>
</a>
</sc-for>
<a href="BrandDetail.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 0">
<span style="width: 32px; height: 32px; border-radius: 16px; background: var(--int); color: var(--on-int); display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 800">JOOLA</span>
<span style="flex: 1; font-size: 15px"><b>Perseus</b> line by JOOLA</span>
<span style="font-size: 13px; color: var(--text-2)">Brand</span>
</a>
</div>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 292px; background: var(--surface); padding: 8px 3px 0; display: flex; flex-direction: column; gap: 11px">
<sc-for list="{{keys}}" as="row" hint-placeholder-count="3">
<div style="display: flex; justify-content: center; gap: 6px">
<sc-for list="{{row}}" as="k" hint-placeholder-count="10">
<span style="width: 33px; height: 42px; border-radius: 6px; background: var(--surface-elev); box-shadow: 0 1px 0 var(--border); display: flex; align-items: center; justify-content: center; font-size: 22px">{{k}}</span>
</sc-for>
</div>
</sc-for>
<div style="display: flex; gap: 6px; padding: 0 3px">
<span style="width: 88px; height: 42px; border-radius: 6px; background: var(--surface-pressed); display: flex; align-items: center; justify-content: center; font-size: 16px">123</span>
<span style="flex: 1; height: 42px; border-radius: 6px; background: var(--surface-elev); box-shadow: 0 1px 0 var(--border); display: flex; align-items: center; justify-content: center; font-size: 16px">space</span>
<span style="width: 88px; height: 42px; border-radius: 6px; background: var(--int); color: var(--on-int); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">search</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      mode: this.props.theme === 'dark' ? 'dark' : '',
      products: [
        { c1: '#1F5FD1', c2: '#C8F03C', name: 'JOOLA Perseus Pro IV 16mm', meta: 'From $179 new · 6 pre-owned from $110' },
        { c1: '#1F5FD1', c2: '#FFFFFF', name: 'JOOLA Perseus Pro IV 14mm', meta: 'From $189 new · 2 pre-owned' },
        { c1: '#2B2D42', c2: '#EF233C', name: 'JOOLA Perseus CFS 16mm', meta: 'From $129 new · lowest in 30 days' }
      ],
      queries: [
        { rest: ' pro iv', scope: 'in Paddles' },
        { rest: ' used', scope: 'in Pre-owned' },
        { rest: ' grip', scope: 'in Accessories' }
      ],
      keys: [
        ['q','w','e','r','t','y','u','i','o','p'],
        ['a','s','d','f','g','h','j','k','l'],
        ['⇧','z','x','c','v','b','n','m','⌫']
      ]
    };
  }
}
</script>
</body>
</html>
