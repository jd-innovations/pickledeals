<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sell · details</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="pd {{mode}}" style="width: 390px; height: 1100px; position: relative; overflow: hidden; display: flex; flex-direction: column">
<div style="padding: 54px 16px 0; display: flex; align-items: center; justify-content: space-between">
<a href="SellPrice.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 20px; background: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<span style="font-size: 17px; font-weight: 600">Sell an item</span>
<span class="num" style="width: 40px; text-align: right; font-size: 15px; color: var(--text-2)">5/6</span>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; padding: 14px 16px 0"><span style="height: 4px; border-radius: 2px; background: var(--int)"></span><span style="height: 4px; border-radius: 2px; background: var(--int)"></span><span style="height: 4px; border-radius: 2px; background: var(--int)"></span><span style="height: 4px; border-radius: 2px; background: var(--int)"></span><span style="height: 4px; border-radius: 2px; background: var(--int)"></span><span style="height: 4px; border-radius: 2px; background: var(--border)"></span></div>
<h1 style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em; padding: 20px 16px 0">Details &amp; handover</h1>
<label style="margin: 16px 16px 0; padding: 12px 14px; border-radius: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; color: var(--text-2)">Description</span>
<textarea rows="4" style="border: 0; outline: 0; background: transparent; resize: none; font-size: 16px; line-height: 1.4">About 15 sessions on it — moved to the 14mm. Edge guard is clean, face still has good grit. Original cover included.</textarea>
<span class="num" style="align-self: flex-end; font-size: 12px; color: var(--text-3)">132 / 1000</span>
</label>
<section style="margin: 20px 16px 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 17px; font-weight: 700">Location</span><button style="font-size: 15px; font-weight: 600; color: var(--text-2)">Change</button></div>
<div style="position: relative; height: 150px; border-radius: 18px; overflow: hidden">
<div style="position: absolute; left: -60px; top: -260px; width: 510px; height: 844px"><dc-import name="MapBase" hint-size="100%,100%"></dc-import></div>
<div style="position: absolute; left: 130px; top: 20px; width: 110px; height: 110px; border-radius: 55px; background: rgba(10,10,10,.10); border: 1.5px dashed var(--text-3)"></div>
<span class="glass" style="position: absolute; left: 10px; bottom: 10px; padding: 6px 10px; border-radius: 10px; font-size: 13px; font-weight: 700">Lakewood Ranch, FL</span>
</div>
<span style="font-size: 13px; line-height: 1.4; color: var(--text-2); display: flex; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>Buyers see this area and a distance, never your address. Share a meet-up spot in chat when you’re ready.</span>
</section>
<section style="margin: 20px 16px 0; border-radius: 16px; border: 1px solid var(--border)">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; border-bottom: 1px solid var(--sep)"><div style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Local pickup</span><span style="font-size: 12px; color: var(--text-2)">Meet up in your area</span></div><button role="switch" aria-checked="{{pickup}}" aria-label="Local pickup" onClick="{{tPickup}}" style="width: 51px; height: 31px; border-radius: 16px; background: {{pBg}}; position: relative"><span style="position: absolute; left: {{pX}}; top: 2px; width: 27px; height: 27px; border-radius: 14px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2)"></span></button></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 14px"><div style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Will ship</span><span style="font-size: 12px; color: var(--text-2)">You and the buyer arrange postage</span></div><button role="switch" aria-checked="{{ship}}" aria-label="Will ship" onClick="{{tShip}}" style="width: 51px; height: 31px; border-radius: 16px; background: {{sBg}}; position: relative"><span style="position: absolute; left: {{sX}}; top: 2px; width: 27px; height: 27px; border-radius: 14px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2)"></span></button></div>
</section>
<div style="flex-grow: 1"></div>
<div style="padding: 12px 16px 34px"><a href="SellPreview.dc.html" style="height: 54px; border-radius: 27px; background: var(--int); color: var(--on-int); font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Preview listing</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pickup: true, ship: true }; }
  renderVals() {
    const s = this.state;
    return {
      mode: this.props.theme === 'dark' ? 'dark' : '',
      pickup: s.pickup, ship: s.ship,
      pBg: s.pickup ? 'var(--int)' : 'var(--border)', pX: s.pickup ? '22px' : '2px',
      sBg: s.ship ? 'var(--int)' : 'var(--border)', sX: s.ship ? '22px' : '2px',
      tPickup: () => this.setState({ pickup: !s.pickup }),
      tShip: () => this.setState({ ship: !s.ship })
    };
  }
}
</script>
</body>
</html>
