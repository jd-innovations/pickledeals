<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sell · photos</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="pd {{mode}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column">
<div style="padding: 54px 16px 0; display: flex; align-items: center; justify-content: space-between">
<a href="SellStart.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 20px; background: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<span style="font-size: 17px; font-weight: 600">Sell an item</span>
<span class="num" style="width: 40px; text-align: right; font-size: 15px; color: var(--text-2)">2/6</span>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; padding: 14px 16px 0"><span style="height: 4px; border-radius: 2px; background: var(--int)"></span><span style="height: 4px; border-radius: 2px; background: var(--int)"></span><span style="height: 4px; border-radius: 2px; background: var(--border)"></span><span style="height: 4px; border-radius: 2px; background: var(--border)"></span><span style="height: 4px; border-radius: 2px; background: var(--border)"></span><span style="height: 4px; border-radius: 2px; background: var(--border)"></span></div>
<div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 6px">
<h1 style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Add photos</h1>
<span style="font-size: 15px; color: var(--text-2)">Up to 10. Drag to reorder — the first is your cover.</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 18px 16px 0">
<div style="position: relative; aspect-ratio: 1; border-radius: 14px; background: var(--img); padding: 10px"><dc-import name="ProductArt" kind="paddle" c1="#1F5FD1" c2="#C8F03C" hint-size="100%,100%"></dc-import><span style="position: absolute; left: 6px; bottom: 6px; font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 3px 6px; border-radius: 5px; background: var(--int); color: var(--on-int)">COVER</span></div>
<div style="aspect-ratio: 1; border-radius: 14px; background: var(--img); padding: 10px; transform: rotate(180deg)"><dc-import name="ProductArt" kind="paddle" c1="#1F5FD1" c2="#C8F03C" hint-size="100%,100%"></dc-import></div>
<div style="aspect-ratio: 1; border-radius: 14px; background: var(--img); padding: 4px; overflow: hidden"><div style="width: 100%; height: 100%; transform: scale(1.8) translate(-8%, 18%)"><dc-import name="ProductArt" kind="paddle" c1="#1F5FD1" c2="#C8F03C" hint-size="100%,100%"></dc-import></div></div>
<button style="aspect-ratio: 1; border-radius: 14px; background: var(--int); color: var(--on-int); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span style="font-size: 13px; font-weight: 700">Camera</span></button>
<button style="aspect-ratio: 1; border-radius: 14px; border: 1.5px dashed var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text-2)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 16l5-5 4 4 3-3 4 4"/></svg><span style="font-size: 13px; font-weight: 700">Library</span></button>
<div style="aspect-ratio: 1; border-radius: 14px; border: 1.5px dashed var(--border)"></div>
</div>
<div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 700">Shots buyers look for</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="height: 34px; padding: 0 12px; border-radius: 17px; background: var(--int); color: var(--on-int); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Face</span>
<span style="height: 34px; padding: 0 12px; border-radius: 17px; background: var(--int); color: var(--on-int); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Back</span>
<span style="height: 34px; padding: 0 12px; border-radius: 17px; background: var(--int); color: var(--on-int); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Edge guard</span>
<span style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--border); font-size: 13px; font-weight: 600; display: flex; align-items: center">Grip</span>
<span style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--border); font-size: 13px; font-weight: 600; display: flex; align-items: center">Any flaws</span>
</div>
</div>
<div style="flex-grow: 1"></div>
<div style="padding: 12px 16px 34px; display: flex; flex-direction: column; gap: 10px">
<span class="num" style="text-align: center; font-size: 13px; color: var(--text-2)">3 photos added · stock catalog photo is never used as your cover</span>
<a href="SellCondition.dc.html" style="height: 54px; border-radius: 27px; background: var(--int); color: var(--on-int); font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Continue</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { mode: this.props.theme === 'dark' ? 'dark' : '' }; }
}
</script>
</body>
</html>
