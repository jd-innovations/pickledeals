<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sell · price</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="pd {{mode}}" style="width: 390px; height: 1000px; position: relative; overflow: hidden; display: flex; flex-direction: column">
<div style="padding: 54px 16px 0; display: flex; align-items: center; justify-content: space-between">
<a href="SellCondition.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 20px; background: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<span style="font-size: 17px; font-weight: 600">Sell an item</span>
<span class="num" style="width: 40px; text-align: right; font-size: 15px; color: var(--text-2)">4/6</span>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; padding: 14px 16px 0"><span style="height: 4px; border-radius: 2px; background: var(--int)"></span><span style="height: 4px; border-radius: 2px; background: var(--int)"></span><span style="height: 4px; border-radius: 2px; background: var(--int)"></span><span style="height: 4px; border-radius: 2px; background: var(--int)"></span><span style="height: 4px; border-radius: 2px; background: var(--border)"></span><span style="height: 4px; border-radius: 2px; background: var(--border)"></span></div>
<div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 6px">
<h1 style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Set your price</h1>
<span style="font-size: 15px; color: var(--text-2)">Perseus Pro IV 16mm · Excellent</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 24px 16px 0">
<button aria-label="Decrease by $5" onClick="{{dec}}" style="width: 52px; height: 52px; border-radius: 26px; background: var(--chip); font-size: 28px; display: flex; align-items: center; justify-content: center">−</button>
<span class="num" style="font-size: 64px; font-weight: 700; letter-spacing: -0.045em">${{price}}</span>
<button aria-label="Increase by $5" onClick="{{inc}}" style="width: 52px; height: 52px; border-radius: 26px; background: var(--chip); font-size: 28px; display: flex; align-items: center; justify-content: center">+</button>
</div>
<span class="num" style="text-align: center; font-size: 15px; font-weight: 600; padding-top: 2px">{{verdict}}</span>
<div style="margin: 20px 16px 0; padding: 16px; border-radius: 20px; background: var(--surface); display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 15px; font-weight: 700">What it sells for</span>
<div style="position: relative; height: 56px">
<div style="position: absolute; left: 0; right: 0; top: 24px; height: 6px; border-radius: 3px; background: var(--border)"></div>
<div style="position: absolute; left: 27%; width: 31%; top: 24px; height: 6px; border-radius: 3px; background: var(--text-3)"></div>
<div style="position: absolute; left: {{pos}}; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px"><span class="num" style="font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: var(--int); color: var(--on-int)">You</span><span style="width: 14px; height: 14px; border-radius: 7px; background: var(--int); border: 3px solid var(--surface); margin-top: 2px"></span></div>
<div style="position: absolute; left: 82%; top: 18px; display: flex; flex-direction: column; align-items: center; transform: translateX(-50%)"><span style="width: 2px; height: 18px; background: var(--text-1)"></span><span class="num" style="font-size: 11px; font-weight: 700; margin-top: 2px">New $179</span></div>
</div>
<div class="num" style="display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2)"><span>Used, Excellent: $120–$145</span><span>14 sold in 90 days</span></div>
</div>
<div style="display: flex; gap: 8px; padding: 14px 16px 0">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="3">
<button onClick="{{p.pick}}" style="flex: 1; height: 56px; border-radius: 14px; background: {{p.bg}}; color: {{p.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px"><span class="num" style="font-size: 17px; font-weight: 700">{{p.v}}</span><span style="font-size: 11px; font-weight: 600; opacity: .75">{{p.label}}</span></button>
</sc-for>
</div>
<div style="margin: 16px 16px 0; border-radius: 16px; border: 1px solid var(--border)">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; border-bottom: 1px solid var(--sep)"><div style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Accept offers</span><span style="font-size: 12px; color: var(--text-2)">Buyers can send structured offers</span></div><span role="switch" aria-checked="true" aria-label="Accept offers" style="width: 51px; height: 31px; border-radius: 16px; background: var(--int); position: relative"><span style="position: absolute; right: 2px; top: 2px; width: 27px; height: 27px; border-radius: 14px; background: var(--on-int)"></span></span></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 14px"><span style="font-size: 15px; font-weight: 600">Hide offers below</span><span class="num" style="font-size: 15px; color: var(--text-2)">$110 ›</span></div>
</div>
<div style="flex-grow: 1"></div>
<div style="padding: 12px 16px 34px; display: flex; flex-direction: column; gap: 10px">
<span style="text-align: center; font-size: 13px; color: var(--text-2)">Free to list. PickleDeals takes no fee.</span>
<a href="SellDetails.dc.html" style="height: 54px; border-radius: 27px; background: var(--int); color: var(--on-int); font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Continue</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { price: 150 }; }
  renderVals() {
    const p = this.state.price;
    const set = (v) => () => this.setState({ price: v });
    const mk = (v, label) => ({ v: '$' + v, label, pick: set(v), bg: p === v ? 'var(--int)' : 'var(--chip)', fg: p === v ? 'var(--on-int)' : 'var(--text-1)' });
    const min = 80, max = 200;
    const pos = Math.max(0, Math.min(100, (p - min) / (max - min) * 100)) + '%';
    let verdict = '$' + (179 - p) + ' under the best new price';
    if (p >= 179) verdict = 'At or above the best new price — unlikely to sell';
    else if (p > 145) verdict += ' · above typical, expect offers';
    else if (p >= 120) verdict += ' · right in the typical range';
    else verdict += ' · priced to sell fast';
    return {
      mode: this.props.theme === 'dark' ? 'dark' : '',
      price: p, pos, verdict,
      dec: () => this.setState({ price: Math.max(5, p - 5) }),
      inc: () => this.setState({ price: p + 5 }),
      presets: [mk(125, 'Quick sale'), mk(135, 'Typical'), mk(150, 'Top of range')]
    };
  }
}
</script>
</body>
</html>
