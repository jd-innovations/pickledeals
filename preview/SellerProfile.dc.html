<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seller profile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="pd {{mode}}" style="width: 390px; height: 1300px; position: relative; overflow: hidden">
<div style="padding: 54px 16px 0; display: flex; align-items: center; justify-content: space-between">
<a href="ListingDetail.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 20px; background: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<button aria-label="More" style="width: 40px; height: 40px; border-radius: 20px; background: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
</div>
<section style="padding: 16px 16px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<span style="width: 88px; height: 88px; border-radius: 44px; background: var(--surface-pressed); display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700">M</span>
<h1 style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-top: 6px">Marcus T.</h1>
<span class="num" style="font-size: 15px; color: var(--text-2)">Lakewood Ranch, FL · member since March 2025</span>
<div style="display: flex; gap: 6px; margin-top: 4px">
<span style="font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 8px; background: var(--chip); display: flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Phone verified</span>
<span style="font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 8px; background: var(--chip); display: flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Email verified</span>
</div>
</section>
<section class="num" style="margin: 20px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-radius: 18px; background: var(--surface)">
<div style="padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 22px; font-weight: 700">4</span><span style="font-size: 12px; color: var(--text-2)">Active</span></div>
<div style="padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 2px; border-left: 1px solid var(--bg); border-right: 1px solid var(--bg)"><span style="font-size: 22px; font-weight: 700">14</span><span style="font-size: 12px; color: var(--text-2)">Sold</span></div>
<div style="padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 22px; font-weight: 700">~1 hr</span><span style="font-size: 12px; color: var(--text-2)">Typical reply</span></div>
</section>
<div role="tablist" aria-label="Listings" style="margin: 20px 16px 0; height: 36px; border-radius: 10px; background: var(--surface); padding: 2px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
<button role="tab" aria-selected="true" style="border-radius: 8px; background: var(--surface-elev); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-size: 15px; font-weight: 600; text-align: center">Active 4</button>
<button role="tab" aria-selected="false" style="border-radius: 8px; font-size: 15px; font-weight: 600; color: var(--text-2); text-align: center">Sold 14</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 12px; padding: 16px">
<sc-for list="{{items}}" as="l" hint-placeholder-count="4">
<a href="ListingDetail.dc.html" style="display: flex; flex-direction: column; gap: 5px">
<div style="position: relative; height: 173px; border-radius: 16px; background: var(--img); padding: 16px"><dc-import name="ProductArt" kind="{{l.k}}" c1="{{l.c1}}" c2="{{l.c2}}" hint-size="100%,100%"></dc-import><span style="position: absolute; left: 8px; bottom: 8px; font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 6px; background: var(--bg)">{{l.cond}}</span></div>
<span class="num" style="font-size: 17px; font-weight: 700; padding-top: 3px">{{l.price}} <span style="font-size: 12px; font-weight: 500; color: var(--text-2)">{{l.newp}}</span></span>
<span style="font-size: 15px; font-weight: 500; line-height: 1.25">{{l.name}}</span>
</a>
</sc-for>
</div>
<button style="margin: 0 16px; font-size: 15px; color: var(--text-2); text-decoration: underline; text-underline-offset: 3px">Report this seller</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      mode: this.props.theme === 'dark' ? 'dark' : '',
      items: [
        { k: 'paddle', c1: '#1F5FD1', c2: '#C8F03C', cond: 'Excellent', price: '$150', newp: 'New $179', name: 'JOOLA Perseus Pro IV 16mm' },
        { k: 'shoe', c1: '#FF5D8F', c2: '#1C1C1C', cond: 'Good', price: '$45', newp: 'New $94', name: 'Skechers Viper Court · 11' },
        { k: 'bag', c1: '#111111', c2: '#C8F03C', cond: 'Like New', price: '$60', newp: 'New $84', name: 'JOOLA Vision II Backpack' },
        { k: 'ball', c1: '#D8F23A', c2: '#000', cond: 'New / Sealed', price: '$18', newp: 'New $27', name: 'Franklin X-40, 12-pack' }
      ]
    };
  }
}
</script>
</body>
</html>
