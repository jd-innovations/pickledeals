<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Primary" class="glass" style="width: 358px; height: 64px; border-radius: 32px; border: 0.5px solid var(--border); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: space-between; padding: 0 6px; color: var(--text-1)">
<a href="DealsHome.dc.html" style="width: 66px; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: {{bg.deals}}; color: {{fg.deals}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.4"/></svg>
<span style="font-size: 10px; font-weight: 600">Deals</span>
</a>
<a href="MarketHome.dc.html" style="width: 66px; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: {{bg.market}}; color: {{fg.market}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v11H4z"/><path d="M9.5 20v-5.5h5V20"/></svg>
<span style="font-size: 10px; font-weight: 600">Pre-owned</span>
</a>
<a href="SellStart.dc.html" aria-label="Sell an item" style="width: 52px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; background: var(--int); color: var(--on-int)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</a>
<a href="Saved.dc.html" style="position: relative; width: 66px; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: {{bg.watch}}; color: {{fg.watch}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.4-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.8-7.5 10.2-7.5 10.2z"/></svg>
<span style="font-size: 10px; font-weight: 600">Watchlist</span>
<span style="position: absolute; top: 6px; right: 16px; width: 8px; height: 8px; border-radius: 4px; background: var(--text-1); border: 1.5px solid var(--bg)"></span>
</a>
<a href="Inbox.dc.html" style="position: relative; width: 66px; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: {{bg.inbox}}; color: {{fg.inbox}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 0 1-12.3 7.6L3.5 20.5l1-4.4A8.5 8.5 0 1 1 20.5 12z"/></svg>
<span style="font-size: 10px; font-weight: 600">Inbox</span>
<span class="num" style="position: absolute; top: 3px; right: 12px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--int); color: var(--on-int); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--bg)">2</span>
</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["deals","market","watch","inbox","none"],"default":"deals"},"$preview":{"width":358,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'deals';
    const bg = {}, fg = {};
    ['deals','market','watch','inbox'].forEach((k) => {
      bg[k] = a === k ? 'var(--surface-pressed)' : 'transparent';
      fg[k] = a === k ? 'var(--text-1)' : 'var(--text-2)';
    });
    return { bg, fg };
  }
}
</script>
</body>
</html>
