<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Website · Brand</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
<link rel="stylesheet" href="./web.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="pd {{mode}}" style="width: 1440px; min-height: 1900px; position: relative; background: var(--bg)">
<dc-import name="WebHeader" active="brands" hint-size="1440px,157px"></dc-import>
<main class="wrap" style="padding-top: 24px; padding-bottom: 32px; display: flex; flex-direction: column; gap: 32px">
<nav aria-label="Breadcrumb" style="font-size: 13px; color: var(--text-2); display: flex; gap: 6px"><a href="WebHome.dc.html">Brands</a><span>›</span><span style="color: var(--text-1)">JOOLA</span></nav>
<section style="display: flex; align-items: center; gap: 24px">
<span style="width: 104px; height: 104px; border-radius: 52px; background: var(--int); color: var(--on-int); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; letter-spacing: -0.02em">JOOLA</span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<h1 style="font-size: 44px; font-weight: 800; letter-spacing: -0.03em">JOOLA</h1>
<span class="num" style="font-size: 15px; color: var(--text-2)">42 live deals · 3 promo codes · 31 products · 18 pre-owned</span>
</div>
<a href="#" style="height: 44px; padding: 0 18px; border-radius: 22px; background: var(--chip); font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px">Visit JOOLA.com<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 17L17 7"/><path d="M9 7h8v8"/></svg></a>
<a href="WebSaveInApp.dc.html" style="height: 44px; padding: 0 18px; border-radius: 22px; background: var(--int); color: var(--on-int); font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Follow in the app</a>
<button aria-label="Share" style="width: 44px; height: 44px; border-radius: 22px; background: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
</section>

<section style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px">
<sc-for list="{{promos}}" as="p" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; border: 1.5px dashed var(--border)">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{p.t}}</span><span style="font-size: 12px; color: var(--text-2)">{{p.d}}</span></div>
<button style="height: 36px; padding: 0 10px; border-radius: 10px; background: var(--surface); font-family: ui-monospace, 'SF Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: .05em">{{p.code}}</button>
</div>
</sc-for>
</section>

<section style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; gap: 8px"><sc-for list="{{chips}}" as="c" hint-placeholder-count="5"><span style="height: 36px; padding: 0 14px; border-radius: 18px; background: {{c.bg}}; color: {{c.fg}}; font-size: 15px; font-weight: 600; display: flex; align-items: center">{{c.t}}</span></sc-for></div>
<button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--border); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px">Sort: Best deal<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 28px 20px">
<sc-for list="{{items}}" as="d" hint-placeholder-count="10">
<dc-import name="WebDealCard" kind="{{d.kind}}" c1="{{d.c1}}" c2="{{d.c2}}" brand="JOOLA" name="{{d.name}}" price="{{d.price}}" was="{{d.was}}" off="{{d.off}}" meta="{{d.meta}}" badge="{{d.badge}}" rank="" hint-size="100%,340px"></dc-import>
</sc-for>
</div>
</section>
</main>
<dc-import name="WebFooter" hint-size="1440px,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (t, on) => ({ t, bg: on ? 'var(--int)' : 'var(--surface)', fg: on ? 'var(--on-int)' : 'var(--text-1)' });
    const items = [
      { kind: 'paddle', c1: '#1F5FD1', c2: '#C8F03C', badge: 'LOWEST PRICE', name: 'Perseus Pro IV 16mm', price: '$179', was: '$279', off: '−36%', meta: 'JOOLA.com · with code' },
      { kind: 'paddle', c1: '#0A0A0A', c2: '#C8F03C', badge: '', name: 'Ben Johns Hyperion 3S', price: '$199', was: '$279', off: '−29%', meta: '3 stores' },
      { kind: 'paddle', c1: '#7B2CBF', c2: '#F72585', badge: 'HOT DEAL', name: 'Scorpeus 3S 14mm', price: '$169', was: '$249', off: '−32%', meta: 'CourtSide Pro Shop' },
      { kind: 'bag', c1: '#EF476F', c2: '#FFD166', badge: '', name: 'Vision Backpack', price: '$79', was: '$99', off: '−20%', meta: 'JOOLA.com' },
      { kind: 'ball', c1: '#D8F23A', c2: '#000', badge: '', name: 'Primo Outdoor Balls, 12-pack', price: '$29', was: '$36', off: '−19%', meta: 'JOOLA.com · with code' }
    ];
    return {
      mode: this.props.theme === 'dark' ? 'dark' : '',
      promos: [
        { t: '15% off sitewide', d: 'JOOLA.com · ends Oct 16 · exclusive', code: 'DINK15' },
        { t: 'Free overgrips with any paddle', d: 'JOOLA.com · while supplies last', code: 'GRIPS' },
        { t: '$10 off bags over $60', d: 'JOOLA.com · ends in 5 days', code: 'BAG10' }
      ],
      chips: [chip('All', true), chip('Paddles'), chip('Bags'), chip('Balls'), chip('Apparel')],
      items: items.concat(items)
    };
  }
}
</script>
</body>
</html>
