<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web deal card</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
<link rel="stylesheet" href="./web.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div class="card-h" style="position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<a href="{{href}}" style="display: flex; flex-direction: column; gap: 6px">
<div class="card-img" style="position: relative; aspect-ratio: 1 / 1; border-radius: 16px; background: var(--img); padding: 18px">
<dc-import name="ProductArt" kind="{{kind}}" c1="{{c1}}" c2="{{c2}}" hint-size="100%,100%"></dc-import>
<sc-if value="{{badge}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 10px; top: 10px; font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 4px 7px; border-radius: 6px; background: var(--bg)">{{badge}}</span></sc-if>
<sc-if value="{{rank}}" hint-placeholder-val="{{false}}"><span class="num" style="position: absolute; left: 10px; bottom: 10px; width: 26px; height: 26px; border-radius: 13px; background: var(--int); color: var(--on-int); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{rank}}</span></sc-if>
</div>
<span style="font-size: 12px; font-weight: 600; color: var(--text-2); margin-top: 2px">{{brand}}</span>
<span class="clamp2" style="font-size: 15px; font-weight: 500; line-height: 1.25; margin-top: -2px; min-height: 37px">{{name}}</span>
<div style="display: flex; align-items: baseline; gap: 6px"><span class="num" style="font-size: 18px; font-weight: 700">{{price}}</span><span class="num" style="font-size: 13px; color: var(--text-3); text-decoration: line-through">{{was}}</span><sc-if value="{{off}}" hint-placeholder-val="{{true}}"><span class="num" style="margin-left: auto; font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: var(--int); color: var(--on-int)">{{off}}</span></sc-if></div>
<span class="num" style="font-size: 12px; color: var(--text-2)">{{meta}}</span>
</a>
<button aria-label="Save" class="glass" style="position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.4-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.8-7.5 10.2-7.5 10.2z"/></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"default":"paddle"},"c1":{"default":"#1F5FD1"},"c2":{"default":"#C8F03C"},"brand":{"default":"JOOLA"},"name":{"default":"Perseus Pro IV 16mm"},"price":{"default":"$179"},"was":{"default":"$279"},"off":{"default":"−36%"},"meta":{"default":"JOOLA.com · with code"},"badge":{"default":""},"rank":{"default":""},"href":{"default":"WebDealModal.dc.html"},"$preview":{"width":232,"height":340}}'>
class Component extends DCLogic { renderVals() { return this.props; } }
</script>
</body>
</html>
