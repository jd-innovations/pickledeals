<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web header</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
<link rel="stylesheet" href="./web.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<header style="width: 100%; background: var(--bg); border-bottom: 1px solid var(--sep)">
<div style="background: var(--surface)">
<div class="wrap" style="height: 36px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; color: var(--text-2)">
<span>Price alerts, saves and pre-owned chat live in the app.</span>
<a href="WebSaveInApp.dc.html" style="font-weight: 700; color: var(--text-1); display: flex; align-items: center; gap: 4px">Get PickleDeals for iPhone<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
</div>
</div>
<div class="wrap" style="height: 72px; display: flex; align-items: center; gap: 28px">
<a href="WebHome.dc.html" aria-label="PickleDeals home" style="flex-shrink: 0"><img class="logo-b" src="brand/pd-logo-black.svg" alt="PickleDeals" style="height: 32px; width: auto; display: block"><img class="logo-w" src="brand/pd-logo-white.svg" alt="PickleDeals" style="height: 32px; width: auto"></a>
<a href="WebDeals.dc.html" style="flex: 1; max-width: 560px; height: 44px; border-radius: 22px; background: var(--surface); display: flex; align-items: center; gap: 10px; padding: 0 16px; color: var(--text-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span style="font-size: 16px">Search paddles, shoes, brands</span><span style="margin-left: auto; font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border)">/</span></a>
<span style="flex: 1"></span>
<button aria-label="Appearance: System" class="hov" style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: var(--text-1)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
<a href="WebSaveInApp.dc.html" style="height: 40px; padding: 0 18px; border-radius: 20px; background: var(--int); color: var(--on-int); font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>Get the app</a>
</div>
<nav aria-label="Sections" class="wrap" style="height: 48px; display: flex; align-items: stretch; gap: 26px; font-size: 15px; font-weight: 600">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
<a href="{{t.href}}" style="display: flex; align-items: center; color: {{t.fg}}; box-shadow: inset 0 {{t.line}} 0 var(--text-1)">{{t.label}}</a>
</sc-for>
</nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","drops","codes","ending","categories","brands","market","none"],"default":"today"},"$preview":{"width":1440,"height":157}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'today';
    const t = (k, label, href) => ({ label, href, fg: a === k ? 'var(--text-1)' : 'var(--text-2)', line: a === k ? '-2px' : '0' });
    return {
      tabs: [
        t('today', 'Today’s deals', 'WebHome.dc.html'),
        t('drops', 'Price drops', 'WebDeals.dc.html'),
        t('codes', 'Promo codes', 'WebPromoCodes.dc.html'),
        t('ending', 'Ending soon', 'WebDeals.dc.html'),
        t('categories', 'Categories', 'WebDeals.dc.html'),
        t('brands', 'Brands', 'WebBrand.dc.html'),
        t('market', 'Pre-owned', 'WebMarketplace.dc.html')
      ]
    };
  }
}
</script>
</body>
</html>
