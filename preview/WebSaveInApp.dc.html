<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Website · Save in the app (desktop)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
<link rel="stylesheet" href="./web.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="pd {{mode}}" style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: var(--bg)">
<dc-import name="WebHeader" active="none" hint-size="1440px,157px"></dc-import>
<div class="wrap" style="padding-top: 24px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px">
<div style="height: 560px; border-radius: 26px; background: var(--img)"></div>
<div style="display: flex; flex-direction: column; gap: 14px"><div style="height: 20px; width: 40%; border-radius: 6px; background: var(--surface)"></div><div style="height: 44px; width: 80%; border-radius: 8px; background: var(--surface)"></div><div style="height: 240px; border-radius: 22px; background: var(--surface)"></div></div>
</div>
<div style="position: absolute; inset: 0; background: var(--overlay)"></div>

<div role="dialog" aria-label="Save in the app" style="position: absolute; left: 50%; top: 170px; transform: translateX(-50%); width: 560px; border-radius: 28px; background: var(--bg); box-shadow: var(--shadow); padding: 28px; display: grid; grid-template-columns: 1fr 168px; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 52px; height: 52px; border-radius: 13px; background: var(--int); color: var(--on-int); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800">PD</span><div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600; color: var(--text-2)">PickleDeals for iPhone</span><h2 style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Save this in the app</h2></div></div>
<p style="font-size: 15px; line-height: 1.5; color: var(--text-2)">Saves, price alerts and pre-owned chat live in the PickleDeals app, so they follow you and can notify you.</p>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{perks}}" as="p" hint-placeholder-count="3"><div style="display: flex; align-items: center; gap: 10px; font-size: 15px"><span style="width: 28px; height: 28px; border-radius: 14px; background: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>{{p}}</div></sc-for>
</div>
<div style="display: flex; gap: 10px; margin-top: 6px">
<a href="#" style="height: 46px; padding: 0 20px; border-radius: 23px; background: var(--int); color: var(--on-int); font-size: 15px; font-weight: 700; display: flex; align-items: center">Get the app</a>
<a href="WebProduct.dc.html" style="height: 46px; padding: 0 20px; border-radius: 23px; background: var(--chip); font-size: 15px; font-weight: 700; display: flex; align-items: center">Not now</a>
</div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<div aria-label="QR code that opens this product in the app" style="width: 168px; height: 168px; border-radius: 18px; background: #FFFFFF; padding: 14px; display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px">
<sc-for list="{{qr}}" as="q" hint-placeholder-count="100"><span style="background: {{q}}; border-radius: 1px"></span></sc-for>
</div>
<span style="font-size: 12px; color: var(--text-2); text-align: center">Scan with your iPhone camera to open this product in the app</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    let seed = 7;
    const qr = Array.from({ length: 100 }, (_, i) => {
      const r = Math.floor(i / 10), c = i % 10;
      const finder = (r < 3 && c < 3) || (r < 3 && c > 6) || (r > 6 && c < 3);
      seed = (seed * 9301 + 49297) % 233280;
      return finder || seed / 233280 > 0.55 ? '#0A0A0A' : 'transparent';
    });
    return {
      mode: this.props.theme === 'dark' ? 'dark' : '',
      perks: ['Save products, deals and listings', 'Price alerts when your target is hit', 'Message sellers and make offers'],
      qr
    };
  }
}
</script>
</body>
</html>
