<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Website · Save in the app (phone)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
<link rel="stylesheet" href="./web.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="pd {{mode}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg)">
<div style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="height: 340px; border-radius: 24px; background: var(--img); padding: 30px 60px"><dc-import name="ProductArt" kind="paddle" c1="#1F5FD1" c2="#C8F03C" hint-size="100%,100%"></dc-import></div>
<span style="font-size: 13px; font-weight: 600; color: var(--text-2)">JOOLA · Paddles</span>
<span style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Perseus Pro IV 16mm</span>
</div>
<div style="position: absolute; inset: 0; background: var(--overlay)"></div>
<div role="dialog" aria-label="Save in the app" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; background: var(--bg); box-shadow: var(--shadow-sheet); padding: 10px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<span style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--border)"></span>
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 52px; height: 52px; border-radius: 13px; background: var(--int); color: var(--on-int); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800">PD</span><div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600; color: var(--text-2)">PickleDeals for iPhone</span><h2 style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Save this in the app</h2></div></div>
<p style="font-size: 15px; line-height: 1.5; color: var(--text-2)">Saves, price alerts and pre-owned chat live in the app. This product opens right where you left it.</p>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{perks}}" as="p" hint-placeholder-count="3"><div style="display: flex; align-items: center; gap: 10px; font-size: 15px"><span style="width: 28px; height: 28px; border-radius: 14px; background: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>{{p}}</div></sc-for>
</div>
<a href="#" style="height: 52px; border-radius: 26px; background: var(--int); color: var(--on-int); font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 4px">Open in the app</a>
<a href="WebHomeMobile.dc.html" style="height: 44px; font-size: 15px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; justify-content: center">Not now</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      mode: this.props.theme === 'dark' ? 'dark' : '',
      perks: ['Save products, deals and listings', 'Price alerts when your target is hit', 'Message sellers and make offers']
    };
  }
}
</script>
</body>
</html>
