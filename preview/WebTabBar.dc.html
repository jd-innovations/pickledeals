<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web tab bar (phone)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pd.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Primary" class="glass" style="width: 358px; height: 64px; border-radius: 32px; border: 0.5px solid var(--border); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: space-between; padding: 0 6px; color: var(--text-1)">
<a href="WebHomeMobile.dc.html" style="width: 80px; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: {{bg.deals}}; color: {{fg.deals}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.4"/></svg>
<span style="font-size: 10px; font-weight: 600">Deals</span>
</a>
<a href="WebMarketplace.dc.html" style="width: 80px; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: {{bg.market}}; color: {{fg.market}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v11H4z"/><path d="M9.5 20v-5.5h5V20"/></svg>
<span style="font-size: 10px; font-weight: 600">Pre-owned</span>
</a>
<a href="WebDeals.dc.html" style="width: 80px; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: {{bg.search}}; color: {{fg.search}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
<span style="font-size: 10px; font-weight: 600">Search</span>
</a>
<a href="WebSaveInAppMobile.dc.html" style="width: 80px; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: var(--int); color: var(--on-int)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
<span style="font-size: 10px; font-weight: 700">Get app</span>
</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["deals","market","search","none"],"default":"deals"},"$preview":{"width":358,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'deals';
    const bg = {}, fg = {};
    ['deals','market','search'].forEach((k) => {
      bg[k] = a === k ? 'var(--surface-pressed)' : 'transparent';
      fg[k] = a === k ? 'var(--text-1)' : 'var(--text-2)';
    });
    return { bg, fg };
  }
}
</script>
</body>
</html>
