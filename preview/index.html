<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PickleDeals preview</title>
<style>
  :root { --bg: #f4f4f3; --fg: #0a0a0a; --muted: #555; --card: #fff; --line: #e2e2e0; }
  :root[data-theme="dark"] { --bg: #0b0b0c; --fg: #f5f5f4; --muted: #a6a6a6; --card: #161617; --line: #2e2e31; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: var(--bg); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
  header .sp { flex: 1; }
  button, select { font: inherit; height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  section { padding: 24px; }
  section h2 { margin: 0 0 16px; font-size: 26px; letter-spacing: -0.02em; }
  .row { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
  figcaption { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  figcaption a { color: inherit; }
  .frame { overflow: hidden; border-radius: 24px; background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08); }
  .frame iframe { border: 0; transform-origin: 0 0; display: block; }
</style>
</head>
<body>
<header>
  <h1>PickleDeals · local preview</h1>
  <span class="sp"></span>
  <label>Scale <select id="scale"><option value="0.5">50%</option><option value="0.65" selected>65%</option><option value="0.8">80%</option><option value="1">100%</option></select></label>
  <label>Screens <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
</header>
<main id="app"></main>
<script>
  const app = document.getElementById('app');
  const scaleSel = document.getElementById('scale');
  const themeSel = document.getElementById('theme');
  let canvas;
  function render() {
    const s = parseFloat(scaleSel.value), theme = themeSel.value;
    document.documentElement.dataset.theme = theme;
    const notes = Object.values(canvas.notes || {}).filter((n) => n.kind === 'title1').sort((a, b) => a.y - b.y);
    const rows = {};
    canvas.order.forEach((f) => { const b = canvas.boards[f]; (rows[b.y] = rows[b.y] || []).push([f, b]); });
    app.innerHTML = '';
    Object.keys(rows).map(Number).sort((a, b) => a - b).forEach((y) => {
      const title = (notes.filter((n) => n.y < y).pop() || {}).text || '';
      const sec = document.createElement('section');
      sec.innerHTML = '<h2></h2><div class="row"></div>';
      sec.querySelector('h2').textContent = title;
      const row = sec.querySelector('.row');
      rows[y].sort((a, b) => a[1].x - b[1].x).forEach(([f, b]) => {
        const sc = b.w > 1000 ? s * 0.5 : s;
        const isDarkCopy = f.startsWith('Dark');
        const url = f + (isDarkCopy || f === 'ProductArt.dc.html' || f === 'TabBar.dc.html' || f === 'MapBase.dc.html' ? '' : '?theme=' + theme);
        const fig = document.createElement('figure');
        fig.innerHTML = '<figcaption><span></span><a target="_blank">Open ↗</a></figcaption><div class="frame"><iframe loading="lazy"></iframe></div>';
        fig.querySelector('span').textContent = b.title || f;
        fig.querySelector('a').href = url;
        const fr = fig.querySelector('.frame');
        fr.style.width = b.w * sc + 'px'; fr.style.height = b.h * sc + 'px';
        if (b.radius) fr.style.borderRadius = b.radius * sc + 'px';
        const ifr = fig.querySelector('iframe');
        ifr.src = url; ifr.width = b.w; ifr.height = b.h; ifr.style.transform = 'scale(' + sc + ')';
        ifr.title = b.title || f;
        row.appendChild(fig);
      });
      app.appendChild(sec);
    });
  }
  fetch('canvas.json').then((r) => r.json()).then((c) => { canvas = c; render(); });
  scaleSel.onchange = render; themeSel.onchange = render;
</script>
</body>
</html>
